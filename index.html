<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zaxo TV</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Zaxo TV">
    <meta property="og:image" content="download.png">
    <meta property="og:description" content="ب خێر هاتن بۆ زاخۆ تیڤی! لێرە فلیمێن کوردی ببینە و ياريان ببينە.">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        margin: 0;
        padding: 0;
        background: #2b5278;
        color: #fff;
      }
      .tgme_page_wrap {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        text-align: center;
      }
      .tgme_page_photo img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-bottom: 20px;
      }
      .tgme_page_title {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .tgme_page_extra {
        color: #8ed3f7;
        margin-bottom: 15px;
      }
      .tgme_page_description {
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .tgme_page_action {
        margin-top: 20px;
      }
      .tgme_action_button_new {
        background-color: #2481cc;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        display: inline-block;
        font-weight: 600;
        border: none;
        cursor: pointer;
      }
      .tgme_page_additional {
        margin-top: 30px;
        font-size: 14px;
        color: #8ed3f7;
      }
    </style>
</head>
<body>
    <div class="tgme_page_wrap">
      <div class="tgme_page_photo">
        <img src="download.png" alt="Zaxo TV">
      </div>
      <div class="tgme_page_title">Zaxo TV</div>
      <div class="tgme_page_extra">5 476 subscribers</div>
      <div class="tgme_page_description">ب خێر هاتن بۆ زاخۆ تیڤی! لێرە فلیمێن کوردی ببینە و ياريان ببينە.</div>
      <div class="tgme_page_action">
        <button class="tgme_action_button_new" id="join-channel-btn">Join Channel</button>
      </div>
      <div class="tgme_page_additional">
        You are invited to join the channel <strong>Zaxo TV</strong>.
      </div>
    </div>
    <script src="js/consent.js"></script>
</body>
</html>
